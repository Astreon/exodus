[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/Astreon/exodus"
publish = false

[workspace.dependencies]
exodus-core = { path = "crates/core" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fluent = "0.17.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "stream",
    "gzip",
] }
rust-embed = "8.13.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
